note: >-
  HubSpot ships first-party API clients for Node, Python, Ruby and PHP only.
  Maven Central group com.hubspot carries HubSpot's open-source infrastructure
  libraries (Singularity, Horizon, algebra, basepom) but NO Java API client, and
  every HubSpot API client on NuGet is community-authored — so neither Java nor
  .NET is recorded as an official SDK here. The published Go SDK is a community
  project, not HubSpot's.
