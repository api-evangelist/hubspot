association_model:
  description: 'HubSpot does not model relationships as foreign keys on the object. Every object-to-object
    link is an ASSOCIATION — a typed edge with its own id, created through the Associations API (openapi/hubspot-associations-api-openapi.yml,
    hubspot-association-type-definitions-api-openapi.yml, hubspot-association-label-management-api-openapi.yml).
    This is why the $ref graph below is sparse relative to the object count: the edges live in a separate
    API, not in the object schemas.'
  apis:
  - openapi/hubspot-associations-api-openapi.yml
  - openapi/hubspot-association-type-definitions-api-openapi.yml
  - openapi/hubspot-association-label-management-api-openapi.yml
  - openapi/hubspot-batch-association-operations-api-openapi.yml
  - openapi/hubspot-object-associations-api-openapi.yml
  shape: '{fromObjectType, fromObjectId, toObjectType, toObjectId, associationTypeId, label}'
