source: openapi/*.yml + openapi/_original/*.yml — component schema $ref graph and id-reference fields
note: Entity-relationship graph derived mechanically from every harvested HubSpot OpenAPI document. Component
  schema $ref links become has_one/has_many edges (has_many when the property is an array); fields matching
  a <object>Id / <object>_id pattern become belongs_to edges. Envelope schemas (Collection/Response/Request/Input/Batch/Paging/Error/Filter/Sort)
  are excluded so the graph reflects domain objects rather than transport wrappers. HubSpot object id-prefixes
  and the canonical object-type ids (0-1 contacts, 0-2 companies, 0-3 deals, 0-5 tickets) are documented
  only behind a login redirect on developers.hubspot.com, so they are NOT recorded here rather than being
  guessed.
