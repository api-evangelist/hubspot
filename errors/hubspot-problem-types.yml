generated: '2026-08-13'
method: searched
source: https://developers.hubspot.com/docs/reference/api/other-resources/error-handling
derived_from: openapi/*.yml (385 4xx/5xx responses across 56 documents)
format: hubspot-error-envelope
format_note: >-
  HubSpot does NOT use RFC 9457 application/problem+json. Every 4xx/5xx response
  in every harvested spec is `application/json` carrying HubSpot's own error
  envelope. Recorded as it is, not normalised into a problem+json shape it does
  not use.
envelope:
  media_type: application/json
  fields:
  - name: status
    type: string
    example: error
  - name: message
    type: string
    description: human-readable error description
  - name: category
    type: string
    description: machine-readable error category
    example: VALIDATION_ERROR
  - name: subCategory
    type: string
    description: finer-grained category, on the detail objects
  - name: correlationId
    type: string
    format: uuid
    description: unique request identifier — quote this to HubSpot support
    example: aeb5f871-7f07-4993-9211-075dc63e7cbf
  - name: errors
    type: array
    description: per-field detail objects
    items:
    - name: message
      type: string
      required: true
    - name: code
      type: string
    - name: in
      type: string
      description: field where the error occurred
    - name: subCategory
      type: string
    - name: context
      type: object
      description: 'map of string -> array of string, e.g. {propertyName: [field_name]}'
  - name: context
    type: object
  - name: links
    type: object
    description: map of string -> string
  note: >-
    HubSpot's own reference states the fields "should all be treated as
    optional" — availability varies between APIs.
response_headers:
- name: x-hubspot-correlation-id
  description: uuid trace id, mirrors the body `correlationId`
  method: probed
- name: x-hubspot-auth-failure
  description: present on authentication failures, e.g. "401 Unauthorized"
  method: probed
probe:
  fetched: '2026-08-13'
  url: https://api.hubapi.com/crm/v3/objects/contacts?limit=1
  http_status: 401
