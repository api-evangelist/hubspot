description: 'HubSpot platform pricing read 2026-10-12 from the rendered pricing page. https://www.hubspot.com/pricing/marketing now redirects to https://www.hubspot.com/pricing/, a single "Sales. Marketing.
  Service. All together." platform price list (billed annually) with HubSpot Credits per tier, replacing the per-Hub Marketing Hub tiers recorded 2026-08-13 (USD; Starter $20/mo/seat, Professional $890/mo,
  Enterprise). The page is geo-priced: this fetch was served EUR (€), so price_text is quoted as served. API access is included with the account; there is no API-metered plan, and the binding integration
  limits are in rate-limits/hubspot-rate-limits.yml.'
note: Prices are geo-localised by HubSpot; a US visitor sees USD. Quotes are verbatim from the EUR rendering fetched on 2026-10-12.
