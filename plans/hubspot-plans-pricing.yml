notes:
  - >-
    Marketing-contact overage pricing is quoted in banded tiers on HubSpot's
    pricing page rather than as a single per-contact rate, so no overage unit
    price is asserted here.
  - >-
    Prices are US list prices read on 2026-08-13 and marked "Starts at"; HubSpot
    shows a promotional and a regular rate for Starter and Professional. Both
    are recorded rather than picking one.
