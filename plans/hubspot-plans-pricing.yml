description: >-
  HubSpot Marketing Hub plans, read from the public pricing page on 2026-08-13.
  This replaces the 2026-05-04 bulk-sweep version, which was method: generated.
  HubSpot prices by SEAT plus MARKETING CONTACTS, not by API call — there is no
  API-metered plan and no per-request price. API access is included with the
  account; the limits that bind an integration are the per-app-per-portal rate
  limits in rate-limits/hubspot-rate-limits.yml, which scale with the tier
  below. Other Hubs (Sales, Service, Content, Operations) carry analogous
  Free/Starter/Professional/Enterprise tiers at different prices.
