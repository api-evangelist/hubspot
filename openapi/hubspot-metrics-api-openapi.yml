        dealAmount:
          type: number
          description: The total amount of deals attributed to the campaign.
        dealsNumber:
          type: integer
          description: The number of deals attributed to the campaign.
          format: int32
        revenueAmount:
          type: number
          description: The total revenue amount attributed to the campaign.
    ForwardPaging:
      type: object
      properties:
        next:
          $ref: '#/components/schemas/NextPage'
      description: Paging information for forward-only pagination. Contains the next page reference when more results are available; omitted or empty on the last page.
    MetricsCounters:
      required:
      - influencedContacts
      - newContactsFirstTouch
      - newContactsLastTouch
      - sessions
      type: object
      properties:
        influencedContacts:
          type: integer
          description: The number of contacts influenced by the campaign.
          format: int32
        newContactsFirstTouch:
          type: integer
          description: The number of new contacts attributed to the campaign as the first touchpoint.
          format: int32
        newContactsLastTouch:
          type: integer
          description: The number of new contacts attributed to the campaign as the last touchpoint.
          format: int32
        sessions:
          type: integer
          description: The total number of sessions generated by the campaign.
          format: int32
    Error:
      required:
      - category
      - correlationId
      - message
      type: object
      properties:
        category:
          type: string
          description: The error category
        context:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Context about the error condition
          example: '{invalidPropertyName=[propertyValue], missingScopes=[scope1, scope2]}'
        correlationId:
          type: string
          description: A unique identifier for the request. Include this value with any error reports or support tickets
          format: uuid
          example: aeb5f871-7f07-4993-9211-075dc63e7cbf
        errors:
          type: array
          description: further information about the error
          items:
            $ref: '#/components/schemas/ErrorDetail'
        links:
          type: object
          additionalProperties:
            type: string
          description: A map of link names to associated URIs containing documentation about the error or recommended remediation steps
        message:
          type: string
          description: A human readable message describing the error along with remediation steps where appropriate
          example: An error occurred
        subCategory:
          type: string
          description: A specific category that contains more specific detail about the error
      description: Represents an error response returned by the API when an operation fails. This component is used in various endpoints to provide detailed information about the error encountered.
      example:
        message: Invalid input (details will vary based on the error)
        correlationId: aeb5f871-7f07-4993-9211-075dc63e7cbf
        category: VALIDATION_ERROR
        links:
          knowledge-base: https://www.hubspot.com/products/service/knowledge-base
    NextPage:
      required:
      - after
      type: object
      properties:
        after:
          type: string
          description: A string token used as a cursor to retrieve the next page of results.
        link:
          type: string
          description: A string URL that provides the link to the next page of results.
      description: Specifies the paging information needed to retrieve the next set of results in a paginated API response
    CollectionResponseContactReferenceForwardPaging:
      required:
      - results
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/ForwardPaging'
        results:
          type: array
          description: An array of contact references, each containing an identifier for a contact.
          items:
            $ref: '#/components/schemas/ContactReference'
    ContactReference:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the contact.
  responses:
    Error:
      description: An error occurred.
      content:
        '*/*':
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    developer_hapikey:
      type: apiKey
      name: hapikey
      in: query
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.hubspot.com/oauth/authorize
          tokenUrl: https://api.hubapi.com/oauth/v1/token
          scopes:
            marketing.campaigns.read: ''
            marketing.campaigns.revenue.read: ''
            marketing.campaigns.write: ''
    private_apps:
      type: apiKey
      name: private-app
      in: header
    private_apps_legacy:
      type: apiKey
      name: private-app-legacy
      in: header
x-hubspot-product-tier-requirements:
  marketing: PROFESSIONAL
  sales: FREE
  service: FREE
  cms: FREE
  commerce: FREE
  crmHub: FREE
  dataHub: FREE
