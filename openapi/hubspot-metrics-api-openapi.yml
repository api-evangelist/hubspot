openapi: 3.2.0
info:
  title: Marketing Campaigns Public Metrics API
  description: Basepom for all HubSpot Projects
  version: 2026-03
  x-hubspot-product-tier-requirements:
    marketing: PROFESSIONAL
    sales: FREE
    service: FREE
    cms: FREE
    commerce: FREE
    crmHub: FREE
    dataHub: FREE
servers:
- url: https://api.hubapi.com
tags:
- name: Metrics
paths:
  /marketing/campaigns/2026-03/{campaignGuid}/reports/contacts/{contactType}:
    get:
      tags:
      - Metrics
      summary: Fetch contact IDs
      description: Fetch the list of contact IDs for the specified campaign and contact type
      operationId: get-/marketing/campaigns/2026-03/{campaignGuid}/reports/contacts/{contactType}
      parameters:
      - name: campaignGuid
        in: path
        description: The unique identifier of the campaign
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: contactType
        in: path
        description: The type of contact to filter the list
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: after
        in: query
        description: The paging cursor token of the last successfully read resource will be returned as the `paging.next.after` JSON property of a paged response containing more results.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: endDate
        in: query
        description: "The end date for fetching contact data, in YYYY-MM-DD format.        \nOptional. Example: 2000-01-27    "
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: The maximum number of results to display per page.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
      - name: startDate
        in: query
        description: "The start date for fetching contact data, in YYYY-MM-DD format.    \nOptional. Example: 2000-01-20"
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponseContactReferenceForwardPaging'
        default:
          description: ''
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - marketing.campaigns.read
  /marketing/campaigns/2026-03/{campaignGuid}/reports/metrics:
    get:
      tags:
      - Metrics
      summary: Get Campaign Metrics
      description: This endpoint retrieves key attribution metrics for a specified campaign, such as sessions, new contacts, and influenced contacts.
      operationId: get-/marketing/campaigns/2026-03/{campaignGuid}/reports/metrics
      parameters:
      - name: campaignGuid
        in: path
        description: The unique identifier of the campaign
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: endDate
        in: query
        description: 'The end date for fetching attribution data, in YYYY-MM-DD format.

          Optional. Example: 2000-01-27       '
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: startDate
        in: query
        description: 'The start date for fetching attribution data, in YYYY-MM-DD format.

          Optional. Example: 2000-01-20'
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsCounters'
        default:
          description: ''
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - marketing.campaigns.read
  /marketing/campaigns/2026-03/{campaignGuid}/reports/revenue:
    get:
      tags:
      - Metrics
      summary: Fetch revenue
      description: Fetch revenue attribution report data for a specified campaign
      operationId: get-/marketing/campaigns/2026-03/{campaignGuid}/reports/revenue
      parameters:
      - name: campaignGuid
        in: path
        description: The unique identifier of the campaign
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: attributionModel
        in: query
        description: 'The revenue attribution model used to calculate deal revenue credit. Defaults to LINEAR if not specified. Enum values: LINEAR,            FIRST_INTERACTION, LAST_INTERACTION, FULL_PATH, U_SHAPED, W_SHAPED,          TIME_DECAY, J_SHAPED, INVERSE_J_SHAPED'
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: endDate
        in: query
        description: End date to fetch attribution data, YYYY-MM-DD
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: startDate
        in: query
        description: Start date to fetch attribution data, YYYY-MM-DD
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueAttributionAggregate'
        default:
          description: ''
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - marketing.campaigns.revenue.read
      - oauth2:
        - marketing.campaigns.revenue.lite.read
      - oauth2:
        - marketing.campaigns.revenue.full.read
components:
  schemas:
    ErrorDetail:
      required:
      - message
      type: object
      properties:
        code:
          type: string
          description: The status code associated with the error detail
        context:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Context about the error condition
          example: '{missingScopes=[scope1, scope2]}'
        in:
          type: string
          description: The name of the field or parameter in which the error was found.
        message:
          type: string
          description: A human readable message describing the error along with remediation steps where appropriate
        subCategory:
          type: string
          description: A specific category that contains more specific detail about the error
      description: Represents detailed information about an error that occurred in the API. This component is used to provide additional context and specifics about errors, typically as part of an error response.
    RevenueAttributionAggregate:
      type: object
      properties:
        contactsNumber:
          type: integer
          description: The number of contacts attributed to the campaign.
