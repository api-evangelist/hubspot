      - oauth2:
        - cpq.quotes.read
  /settings/currencies/2026-09/exchange-rates/update-visibility:
    post:
      tags:
      - Exchange Rates
      summary: Change the visibility of a specific currency pairs
      description: Change the visibility setting for a currency pair. This will hide or display a currency pair for users in the HubSpot app.
      operationId: post-/settings/currencies/2026-09/exchange-rates/update-visibility
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrencyPairUpdate'
        required: true
      responses:
        '204':
          description: No content
          content: {}
        default:
          description: ''
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - settings.currencies.write
  /settings/currencies/2026-09/exchange-rates/{exchangeRateId}:
    get:
      tags:
      - Exchange Rates
      summary: Get the details for a specific exchange rate
      description: Retrieve the details for a specific exchange rate specified by its ID.
      operationId: get-/settings/currencies/2026-09/exchange-rates/{exchangeRateId}
      parameters:
      - name: exchangeRateId
        in: path
        description: ''
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRate'
        default:
          description: ''
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - cpq.quotes.write
      - oauth2:
        - crm.objects.quotes.read
      - oauth2:
        - settings.currencies.read
      - oauth2:
        - crm.objects.quotes.write
      - oauth2:
        - cpq.quotes.read
    patch:
      tags:
      - Exchange Rates
      summary: Update a conversion rate
      description: Update an existing conversion rate, specified by its ID.
      operationId: patch-/settings/currencies/2026-09/exchange-rates/{exchangeRateId}
      parameters:
      - name: exchangeRateId
        in: path
        description: ''
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRateMultiplier'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRate'
        default:
          description: ''
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - settings.currencies.write
