      tags:
      - Exchange Rates
      summary: Add a new exchange rate
      description: Create a new exchange rate with specified conversion rate and currency codes.
      operationId: post-/settings/currencies/2026-09/exchange-rates
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRateCreateRequest'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRate'
        default:
          description: ''
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - settings.currencies.write
  /settings/currencies/2026-09/exchange-rates/current:
    get:
      tags:
      - Exchange Rates
      summary: Get all current exchange rates
      description: Retrieve all current exchange rates for all currency pairs.
      operationId: get-/settings/currencies/2026-09/exchange-rates/current
      parameters: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponseExchangeRateNoPaging'
        default:
          description: ''
