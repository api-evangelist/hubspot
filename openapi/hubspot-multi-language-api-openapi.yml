        layoutSections:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LayoutSection_2'
          description: A structure detailing the layout sections of the blog post.
        linkRelCanonicalUrl:
          type: string
          description: Optional override to set the URL to be used in the rel=canonical link tag on the page.
        mabExperimentId:
          type: string
          description: Unique identifier of the MAB Experiment
        metaDescription:
          type: string
          description: A description that goes in <meta> tag on the page.
        name:
          type: string
          description: The internal name of the Blog Post.
        pageExpiryDate:
          type: integer
          description: The date at which this blog post should expire and begin redirecting to another url or page.
          format: int64
        pageExpiryEnabled:
          type: boolean
          description: Boolean describing if the page expiration feature is enabled for this blog post.
        pageExpiryRedirectId:
          type: integer
          description: The ID of another page this blog post's url should redirect to once this blog post expires. Should only set this or pageExpiryRedirectUrl.
          format: int64
        pageExpiryRedirectUrl:
          type: string
          description: The URL this blog post's url should redirect to once it expires. Should only set this or pageExpiryRedirectId.
        password:
          type: string
          description: Set this to create a password protected page. Entering the password will be required to view the page.
        postBody:
          type: string
          description: The HTML of the main post body.
        postSummary:
          type: string
          description: The summary of the blog post that will appear on the main listing page.
        publicAccessRules:
          type: array
          description: Rules for require member registration to access private content.
          items:
            $ref: '#/components/schemas/PublicAccessRule'
        publicAccessRulesEnabled:
          type: boolean
          description: Boolean to determine whether or not to respect publicAccessRules.
        publishDate:
          type: string
          description: The date (ISO8601 format) the blog post is to be published at.
          format: date-time
        publishImmediately:
          type: boolean
          description: Set this to true if you want to be published immediately when the schedule publish endpoint is called, and to ignore the publish_date setting.
        publishedAt:
          type: string
          format: date-time
        rssBody:
          type: string
          description: The contents of the RSS body for this Blog Post.
        rssSummary:
          type: string
          description: The contents of the RSS summary for this Blog Post.
        slug:
          type: string
          description: The path of the this blog post. This field is appended to the domain to construct the url of this post.
        state:
          maxLength: 25
          type: string
          description: An ENUM descibing the current state of this Blog Post.
        tagIds:
          type: array
          description: List of IDs for the tags associated with this Blog Post.
          items:
            type: integer
            format: int64
        themeSettingsValues:
          type: object
          additionalProperties:
            type: object
            properties: {}
          description: A collection of settings specific to the theme applied to the blog post.
        translatedFromId:
          type: string
          description: ID of the primary blog post this object was translated from.
        translations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ContentLanguageVariation_2'
          description: A map of translations for the blog post, each associated with a specific language variation.
        updated:
          type: string
          description: The timestamp (ISO8601 format) when this Blog Post was updated.
          format: date-time
        updatedById:
          type: string
          description: The ID of the user that updated this Blog Post.
        url:
          type: string
          description: A generated field representing the URL of this blog post.
        useFeaturedImage:
          type: boolean
          description: Boolean to determine if this post should use a featuredImage.
        widgetContainers:
          type: object
          additionalProperties:
            type: object
            properties: {}
          description: A data structure containing the data for all the modules inside the containers for this post. This will only be populated if the page has widget containers.
        widgets:
          type: object
          additionalProperties:
            type: object
            properties: {}
          description: A data structure containing the data for all the modules for this page.
    RowMetaData_2:
      required:
      - cssClass
      - styles
      type: object
      properties:
        cssClass:
          type: string
          description: The CSS class applied to the row.
        styles:
          $ref: '#/components/schemas/Styles_2'
    BlogPostLanguageCloneRequestVNext:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: ID of blog post to clone.
        language:
          type: string
          description: Target language of new variant.
        usePublished:
          type: boolean
    ContentLanguageVariation_2:
      required:
      - archivedInDashboard
      - authorName
      - campaign
      - campaignName
      - created
      - id
      - name
      - password
      - publicAccessRules
      - publicAccessRulesEnabled
      - publishDate
      - slug
      - state
      - updated
      type: object
      properties:
        archivedInDashboard:
          type: boolean
          description: If True, the variant will not show up in your dashboard, although the post could still be live.
        authorName:
          type: string
          description: The name of the user who last published the blog post. For posts that haven't been published yet, this property will reflect the user who initially created the draft.
        campaign:
          type: string
          description: The GUID of the marketing campaign this page is a part of.
        campaignName:
          type: string
          description: Name of the associated marketing campaign.
        created:
          type: string
          description: The timestamp (ISO8601 format) when this Blog Post was created.
          format: date-time
        id:
          type: integer
          description: ID of object to set as primary in multi-language group.
          format: int64
        name:
          type: string
          description: The internal name of the content language variation.
        password:
          type: string
          description: Set this to create a password protected page. Entering the password will be required to view the page.
        publicAccessRules:
          type: array
          items:
            $ref: '#/components/schemas/PublicAccessRule'
        publicAccessRulesEnabled:
          type: boolean
          description: Boolean to determine whether or not to respect publicAccessRules.
        publishDate:
          type: string
          description: The date (ISO8601 format) the page is to be published at.
          format: date-time
        slug:
          type: string
          description: The path of the this page. This field is appended to the domain to construct the url of this page.
        state:
          type: string
          description: 'An ENUM describing the current state of this page.


            Maximum string length: 25'
        tagIds:
          type: array
          items:
            type: integer
            format: int64
        updated:
          type: string
          description: The timestamp (ISO8601 format) when this Blog Post was updated.
          format: date-time
    BreakpointStyles_2:
      required:
      - hidden
      - margin
      - padding
      type: object
      properties:
        hidden:
          type: boolean
          description: Boolean indicating if the breakpoint is visible.
        margin:
          $ref: '#/components/schemas/Margin'
        padding:
          $ref: '#/components/schemas/Padding'
    TagCloneRequestVNext:
      required:
      - id
      - name
      type: object
