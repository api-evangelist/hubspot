components:
  schemas:
    BlogAuthorCloneRequestVNext:
      required:
      - blogAuthor
      - id
      type: object
      properties:
        blogAuthor:
          $ref: '#/components/schemas/BlogAuthor'
        id:
          type: string
          description: ID of the object to be cloned.
        language:
          type: string
          description: Language of newly cloned object.
        primaryLanguage:
          type: string
          description: Primary language in multi-language group.
        usePublished:
          type: boolean
    ErrorDetail:
      required:
      - message
      type: object
      properties:
        code:
          type: string
          description: The status code associated with the error detail
        context:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Context about the error condition
          example: '{missingScopes=[scope1, scope2]}'
        in:
          type: string
          description: The name of the field or parameter in which the error was found.
        message:
          type: string
          description: A human readable message describing the error along with remediation steps where appropriate
        subCategory:
          type: string
          description: A specific category that contains more specific detail about the error
      description: Represents detailed information about an error that occurred in the API. This component is used to provide additional context and specifics about errors, typically as part of an error response.
    AttachToLangPrimaryRequestVNext:
      required:
      - id
      - language
      - primaryId
      type: object
      properties:
        id:
          type: string
          description: ID of the object to add to a multi-language group.
        language:
          type: string
          description: Designated language of the object to add to a multi-language group.
          enum:
          - aa
          - ab
          - ae
          - af
          - af-na
          - af-za
          - agq
          - agq-cm
          - ak
          - ak-gh
          - am
          - am-et
          - an
          - ann
          - ann-ng
          - ar
          - ar-001
          - ar-ae
          - ar-bh
          - ar-dj
          - ar-dz
          - ar-eg
