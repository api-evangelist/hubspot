          description: Holds various labels associated with the action, including names and descriptions.
        objectRequestOptions:
          $ref: '#/components/schemas/PublicObjectRequestOptions'
        objectTypes:
          type: array
          items:
            type: string
        outputFields:
          type: array
          items:
            $ref: '#/components/schemas/OutputFieldDefinition'
        published:
          type: boolean
          description: Indicates whether the action is published and available for use.
    PublicConditionalSingleFieldDependency:
      title: CONDITIONAL_SINGLE_FIELD
      required:
      - controllingFieldName
      - controllingFieldValue
      - dependencyType
      - dependentFieldNames
      type: object
      properties:
        controllingFieldName:
          type: string
          description: The name of the field that determines the dependency.
        controllingFieldValue:
          type: string
          description: The value of the controlling field that triggers the dependency.
        dependencyType:
          type: string
          description: The type of dependency, with the default value being CONDITIONAL_SINGLE_FIELD.
          default: CONDITIONAL_SINGLE_FIELD
          enum:
          - CONDITIONAL_SINGLE_FIELD
        dependentFieldNames:
          type: array
          items:
            type: string
      x-hubspot-sub-type-impl: true
    PublicActionDefinitionPatch:
      type: object
      properties:
        actionUrl:
          type: string
          description: The URL endpoint where the action is executed.
        executionRules:
          type: array
          items:
            $ref: '#/components/schemas/PublicExecutionTranslationRule'
        inputFieldDependencies:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/PublicSingleFieldDependency'
            - $ref: '#/components/schemas/PublicConditionalSingleFieldDependency'
        inputFields:
          type: array
          items:
            $ref: '#/components/schemas/PublicInputFieldDefinition'
        labels:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PublicActionLabels'
          description: Contains labels for the action, including names and descriptions.
        objectRequestOptions:
          $ref: '#/components/schemas/PublicObjectRequestOptions'
        objectTypes:
          type: array
          items:
            type: string
        outputFields:
          type: array
          items:
            $ref: '#/components/schemas/OutputFieldDefinition'
        published:
          type: boolean
          description: Indicates whether the action is published and available for use.
    NextPage:
      required:
      - after
      type: object
      properties:
        after:
          type: string
          description: A paging cursor token for retrieving subsequent pages.
        link:
          type: string
          description: A URL that can be used to retrieve the next page results.
      description: Specifies the paging information needed to retrieve the next set of results in a paginated API response
    PublicActionDefinition:
      required:
      - actionUrl
      - functions
      - id
      - inputFields
      - labels
      - objectTypes
      - published
      - revisionId
      type: object
      properties:
        actionUrl:
          type: string
        archivedAt:
          type: integer
          format: int64
        executionRules:
          type: array
