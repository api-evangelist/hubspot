  description: 'Operations tagged Definitions across 2 of this provider''s published API definitions: hubspot-automation-actions-v4-openapi.json, hubspot-communication-preferences-subscriptions-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.hubapi.com
tags:
- name: Definitions
paths:
