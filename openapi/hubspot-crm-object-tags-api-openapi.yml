openapi: 3.0.1
info:
  title: HubSpot CRM Object Tags
  description: Basepom for all HubSpot Projects
  version: 2026-09
  x-hubspot-product-tier-requirements:
    marketing: FREE
    sales: FREE
    service: FREE
    cms: FREE
    commerce: FREE
    crmHub: FREE
    dataHub: FREE
servers:
- url: https://api.hubapi.com
tags:
- name: Basic
paths:
  /crm/object-tags/2026-09/{objectTypeId}:
    get:
      tags:
      - Basic
      summary: Retrieve tags
      description: Retrieve CRM object tags for a specified object type in your HubSpot account. This
        endpoint allows you to access tags associated with a particular object type, which can be useful
        for categorizing and managing CRM data effectively.
      operationId: get-/crm/object-tags/2026-09/{objectTypeId}
      parameters:
      - name: objectTypeId
        in: path
        description: The unique identifier of the object type for which to retrieve tags.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponsePublicCrmObjectTagNoPaging'
        default:
          description: ''
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - crm-pipelines-object-label-access
    post:
      tags:
      - Basic
      summary: Create tag
      description: Create a new CRM object tag for a specified object type in your HubSpot account. This
        endpoint allows you to define properties such as name, color, and filter criteria for the tag.
        It is useful for categorizing and organizing CRM objects based on custom criteria.
      operationId: post-/crm/object-tags/2026-09/{objectTypeId}
      parameters:
      - name: objectTypeId
        in: path
        description: The unique identifier of the object type for which the tag is being created.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicCrmObjectTagRequest'
        required: true
      responses:
        '201':
          description: successful operation
          headers:
            Location:
              description: URL of the newly created resource
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCrmObjectTag'
        default:
          description: ''
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - crm-pipelines-object-label-access
  /crm/object-tags/2026-09/{objectTypeId}/{tagId}:
    get:
      tags:
      - Basic
      summary: Retrieve Tag
      description: Retrieve a specific CRM object tag using its unique identifiers. This endpoint is useful
        for obtaining details about a particular tag associated with a CRM object type, which can help
        in managing or analyzing tagged data within your HubSpot account.
      operationId: get-/crm/object-tags/2026-09/{objectTypeId}/{tagId}
      parameters:
      - name: objectTypeId
        in: path
        description: The unique identifier of the CRM object type to which the tag belongs.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: tagId
        in: path
        description: The unique identifier of the tag to retrieve.
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCrmObjectTag'
        default:
          description: ''
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - crm-pipelines-object-label-access
    put:
      tags:
      - Basic
      summary: Update tag (Replace)
      description: Update an existing CRM object tag in your HubSpot account. This operation allows you
        to modify the properties of a tag identified by its objectTypeId and tagId. Use this endpoint
        to change tag details such as name, color, and associated filters.
      operationId: put-/crm/object-tags/2026-09/{objectTypeId}/{tagId}
      parameters:
      - name: objectTypeId
        in: path
        description: The unique identifier of the object type to which the tag belongs.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: tagId
        in: path
        description: The unique identifier of the tag to be updated.
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePublicCrmObjectTagRequest'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCrmObjectTag'
        default:
          description: ''
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - crm-pipelines-object-label-access
    delete:
      tags:
      - Basic
      summary: Delete
      description: Delete a specific CRM object tag identified by its object type ID and tag ID. This
        operation will remove the tag from the system, and it will no longer be available for use or reference.
      operationId: delete-/crm/object-tags/2026-09/{objectTypeId}/{tagId}
      parameters:
      - name: objectTypeId
        in: path
        description: The unique identifier of the object type to which the tag belongs.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: tagId
        in: path
        description: The unique identifier of the tag to be deleted.
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: No content
          content: {}
        default:
          description: ''
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - crm-pipelines-object-label-access
    patch:
      tags:
      - Basic
      summary: Update tag (Partial)
      description: Update an existing CRM object tag in your HubSpot account. This endpoint allows you
        to modify properties of a specific tag identified by its tagId and objectTypeId. Use this to change
        tag attributes such as color, description, or associated filters.
      operationId: patch-/crm/object-tags/2026-09/{objectTypeId}/{tagId}
      parameters:
      - name: objectTypeId
        in: path
        description: The unique identifier of the object type associated with the tag.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: tagId
        in: path
        description: The unique identifier of the tag to be updated.
        required: true
        style: simple
        explode: false
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPublicCrmObjectTagRequest'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCrmObjectTag'
        default:
          description: ''
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - crm-pipelines-object-label-access
components:
  schemas:
    CollectionResponsePublicCrmObjectTagNoPaging:
      required:
      - results
      type: object
      properties:
        results:
          type: array
          description: An array of CRM object tags. Each item in the array is a PublicCrmObjectTag object.
          items:
            $ref: '#/components/schemas/PublicCrmObjectTag'
    CreatePublicCrmObjectTagRequest:
      required:
      - color
      - displayOrder
      - filterBranch
      - filterPipelineIds
      - name
      type: object
      properties:
        color:
          type: string
          description: The color associated with the CRM object tag. It is a string value.
        description:
          type: string
          description: A string providing additional information about the CRM object tag.
        displayOrder:
          type: integer
          description: An integer indicating the order in which the tag should be displayed.
          format: int32
        filterBranch:
          description: Defines the filter criteria for the CRM object tag. It can be one of several filter
            branch types.
          oneOf:
          - $ref: '#/components/schemas/PublicOrFilterBranch'
          - $ref: '#/components/schemas/PublicAndFilterBranch'
          - $ref: '#/components/schemas/PublicNotAllFilterBranch'
          - $ref: '#/components/schemas/PublicNotAnyFilterBranch'
          - $ref: '#/components/schemas/PublicRestrictedFilterBranch'
          - $ref: '#/components/schemas/PublicUnifiedEventsFilterBranch'
          - $ref: '#/components/schemas/PublicAssociationFilterBranch'
        filterPipelineIds:
          type: array
          description: An array of strings representing the IDs of the pipelines to which the tag applies.
          items:
            type: string
        name:
          type: string
          description: The name of the CRM object tag. It is a string value.
    Error:
      required:
      - category
      - correlationId
      - message
      type: object
      properties:
        category:
          type: string
          description: A string representing the general category of the error.
        context:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: An object containing additional context about the error, with properties that are
            arrays of strings.
          example: '{invalidPropertyName=[propertyValue], missingScopes=[scope1, scope2]}'
        correlationId:
          type: string
          description: A string that acts as a unique identifier for the error instance, useful for tracking
            and debugging.
          format: uuid
          example: aeb5f871-7f07-4993-9211-075dc63e7cbf
        errors:
          type: array
          description: An array of ErrorDetail objects, each providing additional information about specific
            issues related to the error.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        links:
          type: object
          additionalProperties:
            type: string
          description: An object containing URLs that provide further information or actions related to
            the error.
        message:
          type: string
          description: A string containing a human-readable message describing the error.
          example: An error occurred
        subCategory:
          type: string
          description: A string providing a more specific classification of the error within its category.
      description: Represents an error response returned by the API when an operation fails. This component
        is used in various endpoints to provide detailed information about the error encountered.
      example:
        message: Invalid input (details will vary based on the error)
        correlationId: aeb5f871-7f07-4993-9211-075dc63e7cbf
        category: VALIDATION_ERROR
        links:
          knowledge-base: https://www.hubspot.com/products/service/knowledge-base
    ErrorDetail:
      required:
      - message
      type: object
      properties:
        code:
          type: string
          description: The status code associated with the error detail. This is a string property.
        context:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Context about the error condition. It is an object where each key is a string and
            each value is an array of strings, providing additional information about the error.
          example: '{missingScopes=[scope1, scope2]}'
        in:
          type: string
          description: The name of the field or parameter in which the error was found. This is a string
            property.
        message:
          type: string
          description: A human readable message describing the error along with remediation steps where
            appropriate. It is a required string property.
        subCategory:
          type: string
          description: A specific category that contains more specific detail about the error. This is
            a string property.
      description: Represents detailed information about an error that occurred in the API. This component
        is used to provide additional context and specifics about errors, typically as part of an error
        response.
    PatchPublicCrmObjectTagRequest:
      required:
      - color
      - description
      - filterBranch
      - filterPipelineIds
      - name
      type: object
      properties:
        color:
          type: object
          properties: {}
          description: An object representing the new color for the CRM object tag.
        description:
          type: object
          properties: {}
          description: An object representing the new description for the CRM object tag.
        filterBranch:
          type: object
          properties: {}
          description: An object representing the new filter branch for the CRM object tag.
        filterPipelineIds:
          type: object
          properties: {}
          description: An object representing the new set of pipeline IDs associated with the CRM object
            tag.
        name:
          type: object
          properties: {}
          description: An object representing the new name for the CRM object tag.
    PublicAbsoluteComparativeTimestampRefineBy:
      title: ABSOLUTE_COMPARATIVE
      required:
      - comparison
      - timestamp
      - type
      type: object
      properties:
        comparison:
          type: string
          description: A string representing the comparison operation to be performed.
        timestamp:
          type: integer
          description: An integer representing the specific timestamp for comparison, formatted as an
            int64.
          format: int64
        type:
          type: string
          description: A string indicating the type of refinement, which is 'ABSOLUTE_COMPARATIVE' by
            default.
          default: ABSOLUTE_COMPARATIVE
          enum:
          - ABSOLUTE_COMPARATIVE
      x-hubspot-sub-type-impl: true
    PublicAbsoluteRangedTimestampRefineBy:
      title: ABSOLUTE_RANGED
      required:
      - lowerTimestamp
      - rangeType
      - type
      - upperTimestamp
      type: object
      properties:
        lowerTimestamp:
          type: integer
          description: An integer representing the lower boundary of the timestamp range, specified in
            Unix time format.
          format: int64
        rangeType:
          type: string
          description: A string that specifies the type of range being used.
        type:
          type: string
          description: A string indicating the type of refine by operation. The default value is 'ABSOLUTE_RANGED'.
          default: ABSOLUTE_RANGED
          enum:
          - ABSOLUTE_RANGED
        upperTimestamp:
          type: integer
          description: An integer representing the upper boundary of the timestamp range, specified in
            Unix time format.
          format: int64
      x-hubspot-sub-type-impl: true
    PublicAdsSearchFilter:
      title: ADS_SEARCH
      required:
      - adNetwork
      - entityType
      - filterType
      - operator
      - searchTermType
      - searchTerms
      type: object
      properties:
        adNetwork:
          type: string
          description: A string that specifies the ad network where the search is being conducted.
        entityType:
          type: string
          description: A string that represents the type of entity being searched for in the ads.
        filterType:
          type: string
          description: A string that specifies the type of filter being applied. The default value is
            'ADS_SEARCH'.
          default: ADS_SEARCH
          enum:
          - ADS_SEARCH
        operator:
          type: string
          description: A string that defines the operation or condition applied to the search terms.
        searchTermType:
          type: string
          description: A string that indicates the type of search term being used in the filter.
        searchTerms:
          type: array
          description: An array of strings containing the search terms used to filter the ads.
          items:
            type: string
      x-hubspot-sub-type-impl: true
    PublicAdsTimeFilter:
      title: ADS_TIME
      required:
      - filterType
      - pruningRefineBy
      type: object
      properties:
        filterType:
          type: string
          description: A string that specifies the type of filter being applied. The default value is
            'ADS_TIME'.
          default: ADS_TIME
          enum:
          - ADS_TIME
        pruningRefineBy:
          description: An object that defines the criteria for refining the pruning of the filter. It
            can be one of several types, such as PublicNumOccurrencesRefineBy, PublicSetOccurrencesRefineBy,
            or various timestamp refine types.
          oneOf:
          - $ref: '#/components/schemas/PublicNumOccurrencesRefineBy'
          - $ref: '#/components/schemas/PublicSetOccurrencesRefineBy'
          - $ref: '#/components/schemas/PublicRelativeComparativeTimestampRefineBy'
          - $ref: '#/components/schemas/PublicRelativeRangedTimestampRefineBy'
          - $ref: '#/components/schemas/PublicAbsoluteComparativeTimestampRefineBy'
          - $ref: '#/components/schemas/PublicAbsoluteRangedTimestampRefineBy'
          - $ref: '#/components/schemas/PublicAllHistoryRefineBy'
          - $ref: '#/components/schemas/PublicTimePointOperation'
          - $ref: '#/components/schemas/PublicRangedTimeOperation'
      x-hubspot-sub-type-impl: true
    PublicAllHistoryRefineBy:
      title: ALL_HISTORY
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: A string that specifies the type of refinement. The default and only valid value
            is 'ALL_HISTORY'.
          default: ALL_HISTORY
          enum:
          - ALL_HISTORY
      x-hubspot-sub-type-impl: true
    PublicAllPropertyTypesOperation:
      title: ALL_PROPERTY
      required:
      - includeObjectsWithNoValueSet
      - operationType
      - operator
      type: object
      properties:
        includeObjectsWithNoValueSet:
          type: boolean
          description: A boolean indicating whether objects with no value set should be included in the
            operation.
        operationType:
          type: string
          description: A string indicating the type of operation. It is expected to be 'ALL_PROPERTY_TYPES'.
          default: ALL_PROPERTY
          enum:
          - ALL_PROPERTY
        operator:
          type: string
          description: A string representing the operator used in the operation.
      x-hubspot-sub-type-impl: true
    PublicAndFilterBranch:
      title: AND
      required:
      - filterBranchOperator
      - filterBranchType
      - filterBranches
      - filters
      type: object
      properties:
        filterBranchOperator:
          type: string
          description: A string representing the operator used within this filter branch.
        filterBranchType:
          type: string
          description: A string indicating the type of filter branch. The default value is 'AND'.
          default: AND
          enum:
          - AND
        filterBranches:
          type: array
          description: An array of nested filter branches, each of which can be another AND, OR, NOT_ALL,
            NOT_ANY, RESTRICTED, UNIFIED_EVENTS, or ASSOCIATION filter branch.
          items:
            oneOf:
            - $ref: '#/components/schemas/PublicOrFilterBranch'
            - $ref: '#/components/schemas/PublicAndFilterBranch'
            - $ref: '#/components/schemas/PublicNotAllFilterBranch'
            - $ref: '#/components/schemas/PublicNotAnyFilterBranch'
            - $ref: '#/components/schemas/PublicRestrictedFilterBranch'
            - $ref: '#/components/schemas/PublicUnifiedEventsFilterBranch'
            - $ref: '#/components/schemas/PublicAssociationFilterBranch'
        filters:
          type: array
          description: An array of filters that must all be satisfied for this branch to evaluate as true.
            Each filter can be a property filter, association filter, or other types of analytics and
            event filters.
          items:
            oneOf:
            - $ref: '#/components/schemas/PublicPropertyFilter'
            - $ref: '#/components/schemas/PublicAssociationInListFilter'
            - $ref: '#/components/schemas/PublicPageViewAnalyticsFilter'
            - $ref: '#/components/schemas/PublicCtaAnalyticsFilter'
            - $ref: '#/components/schemas/PublicEventAnalyticsFilter'
            - $ref: '#/components/schemas/PublicFormSubmissionFilter'
            - $ref: '#/components/schemas/PublicFormSubmissionOnPageFilter'
            - $ref: '#/components/schemas/PublicIntegrationEventFilter'
            - $ref: '#/components/schemas/PublicEmailSubscriptionFilter'
            - $ref: '#/components/schemas/PublicCommunicationSubscriptionFilter'
            - $ref: '#/components/schemas/PublicSurveyMonkeyFilter'
            - $ref: '#/components/schemas/PublicSurveyMonkeyValueFilter'
            - $ref: '#/components/schemas/PublicWebinarFilter'
            - $ref: '#/components/schemas/PublicEmailEventFilter'
            - $ref: '#/components/schemas/PublicPrivacyAnalyticsFilter'
            - $ref: '#/components/schemas/PublicAdsSearchFilter'
            - $ref: '#/components/schemas/PublicAdsTimeFilter'
            - $ref: '#/components/schemas/PublicInListFilter'
            - $ref: '#/components/schemas/PublicUnifiedEventsFilter'
            - $ref: '#/components/schemas/PublicConstantFilter'
      x-hubspot-sub-type-impl: true
    PublicAssociationFilterBranch:
      title: ASSOCIATION
      required:
      - associationCategory
      - associationTypeId
      - filterBranchOperator
      - filterBranchType
      - filterBranches
      - filters
      - objectTypeId
      - operator
      type: object
      properties:
        associationCategory:
          type: string
          description: A string indicating the category of the association.
        associationTypeId:
          type: integer
          description: An integer representing the unique identifier for the type of association.
          format: int32
        filterBranchOperator:
          type: string
          description: A string representing the operator applied to the filter branch.
        filterBranchType:
          type: string
          description: A string indicating the type of filter branch. Defaults to 'ASSOCIATION'.
          default: ASSOCIATION
          enum:
          - ASSOCIATION
        filterBranches:
          type: array
          description: An array of filter branches, each of which can be one of several types, including
            OR, AND, NOT_ALL, NOT_ANY, RESTRICTED, UNIFIED_EVENTS, or ASSOCIATION.
          items:
            oneOf:
            - $ref: '#/components/schemas/PublicOrFilterBranch'
            - $ref: '#/components/schemas/PublicAndFilterBranch'
            - $ref: '#/components/schemas/PublicNotAllFilterBranch'
            - $ref: '#/components/schemas/PublicNotAnyFilterBranch'
            - $ref: '#/components/schemas/PublicRestrictedFilterBranch'
            - $ref: '#/components/schemas/PublicUnifiedEventsFilterBranch'
            - $ref: '#/components/schemas/PublicAssociationFilterBranch'
        filters:
          type: array
          description: An array of filters that can include various types such as property filters, association
            filters, and analytics filters.
          items:
            oneOf:
            - $ref: '#/components/schemas/PublicPropertyFilter'
            - $ref: '#/components/schemas/PublicAssociationInListFilter'
            - $ref: '#/components/schemas/PublicPageViewAnalyticsFilter'
            - $ref: '#/components/schemas/PublicCtaAnalyticsFilter'
            - $ref: '#/components/schemas/PublicEventAnalyticsFilter'
            - $ref: '#/components/schemas/PublicFormSubmissionFilter'
            - $ref: '#/components/schemas/PublicFormSubmissionOnPageFilter'
            - $ref: '#/components/schemas/PublicIntegrationEventFilter'
            - $ref: '#/components/schemas/PublicEmailSubscriptionFilter'
            - $ref: '#/components/schemas/PublicCommunicationSubscriptionFilter'
            - $ref: '#/components/schemas/PublicSurveyMonkeyFilter'
            - $ref: '#/components/schemas/PublicSurveyMonkeyValueFilter'
            - $ref: '#/components/schemas/PublicWebinarFilter'
            - $ref: '#/components/schemas/PublicEmailEventFilter'
            - $ref: '#/components/schemas/PublicPrivacyAnalyticsFilter'
            - $ref: '#/components/schemas/PublicAdsSearchFilter'
            - $ref: '#/components/schemas/PublicAdsTimeFilter'
            - $ref: '#/components/schemas/PublicInListFilter'
            - $ref: '#/components/schemas/PublicUnifiedEventsFilter'
            - $ref: '#/components/schemas/PublicConstantFilter'
        objectTypeId:
          type: string
          description: A string representing the unique identifier for the object type being filtered.
        operator:
          type: string
          description: A string representing the operator used in the filter branch.
      x-hubspot-sub-type-impl: true
    PublicAssociationInListFilter:
      title: ASSOCIATION
      required:
      - associationCategory
      - associationTypeId
      - coalescingRefineBy
      - filterType
      - listId
      - operator
      type: object
      properties:
        associationCategory:
          type: string
          description: A string indicating the category of the association.
        associationTypeId:
          type: integer
          description: An integer representing the unique identifier for the type of association.
          format: int32
        coalescingRefineBy:
          description: An object used to refine the filter by combining multiple criteria. It can be one
            of several predefined schemas such as PublicNumOccurrencesRefineBy or PublicTimePointOperation.
          oneOf:
          - $ref: '#/components/schemas/PublicNumOccurrencesRefineBy'
          - $ref: '#/components/schemas/PublicSetOccurrencesRefineBy'
          - $ref: '#/components/schemas/PublicRelativeComparativeTimestampRefineBy'
          - $ref: '#/components/schemas/PublicRelativeRangedTimestampRefineBy'
          - $ref: '#/components/schemas/PublicAbsoluteComparativeTimestampRefineBy'
          - $ref: '#/components/schemas/PublicAbsoluteRangedTimestampRefineBy'
          - $ref: '#/components/schemas/PublicAllHistoryRefineBy'
          - $ref: '#/components/schemas/PublicTimePointOperation'
          - $ref: '#/components/schemas/PublicRangedTimeOperation'
        filterType:
          type: string
          description: A string indicating the type of filter. Defaults to 'ASSOCIATION'.
          default: ASSOCIATION
          enum:
          - ASSOCIATION
        listId:
          type: string
          description: A string representing the unique identifier of the list to filter.
        operator:
          type: string
          description: A string representing the operator used in the filter.
        toObjectType:
          type: string
          description: A string representing the type of object that the association points to.
        toObjectTypeId:
          type: string
          description: A string representing the type ID of the object that the association points to.
      x-hubspot-sub-type-impl: true
    PublicBoolPropertyOperation:
      title: BOOL
      required:
      - includeObjectsWithNoValueSet
      - operationType
      - operator
      - value
      type: object
      properties:
        includeObjectsWithNoValueSet:
          type: boolean
          description: A boolean indicating whether objects with no value set for the property should
            be included in the operation.
        operationType:
          type: string
          description: A string indicating the type of operation. The default value is 'BOOLEAN'.
          default: BOOL
          enum:
          - BOOL
        operator:
          type: string
          description: A string representing the operator used in the boolean operation.
        value:
          type: boolean
          description: A boolean representing the value to be used in the operation.
      x-hubspot-sub-type-impl: true
    PublicCalendarDatePropertyOperation:
      title: CALENDAR_DATE
      required:
      - includeObjectsWithNoValueSet
      - operationType
      - operator
      - timeUnit
      type: object
      properties:
        fiscalYearStart:
          type: string
          description: A string specifying the start month of the fiscal year. Valid values include 'JANUARY',
            'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER',
            and 'DECEMBER'.
          enum:
          - APRIL
          - AUGUST
          - DECEMBER
          - FEBRUARY
