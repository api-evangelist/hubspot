    post:
      tags:
      - Advanced
      summary: Create Snapshot
      description: Create a batch of CRM object snapshots for the specified portal. This endpoint allows you to capture the state of CRM objects at a specific point in time, which can be useful for auditing or historical analysis. The request requires a list of CRM object snapshot requests, each specifying the portal ID, object ID, object type ID, and properties to include in the snapshot.
      operationId: post-/webhooks-journal/snapshots/2026-09/crm_/webhooks-journal/snapshots/2026-03/crm
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmObjectSnapshotBatchRequest'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmObjectSnapshotBatchResponse'
        default:
          description: ''
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - webhooks-journal-snapshot-management
      x-hubspot-rate-limit-exemptions:
      - daily
      - ten-secondly
    servers:
    - url: https://api.hubapi.com
  /webhooks-journal/subscriptions/2026-09/filters:
