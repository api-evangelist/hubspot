    FileExtractRequest:
      required:
      - path
      type: object
      properties:
        path:
          type: string
          description: The file system location where the zip file is to be extracted.
    AssetFileMetadata:
      required:
      - createdAt
      - folder
      - id
      - name
      - updatedAt
      type: object
      properties:
        archivedAt:
          type: integer
          description: Timestamp of when the object was archived (deleted).
          format: int64
        children:
          type: array
          description: If the object is a folder, contains the filenames of the files within the folder.
          items:
            type: string
        createdAt:
          type: integer
          description: Timestamp of when the object was first created.
          format: int64
        folder:
          type: boolean
          description: Determines whether or not this path points to a folder.
        hash:
          type: string
          description: A unique identifier for the file's content, used to verify data integrity.
        id:
          type: string
          description: The path of the file in the CMS Developer File System.
        name:
          type: string
          description: The name of the file.
        updatedAt:
          type: integer
          description: Timestamp of when the object was last updated.
          format: int64
    TaskLocator:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the task.
        links:
          type: object
          additionalProperties:
            type: string
          description: A map of link names to associated URIs containing documentation about the error or recommended remediation steps
    ActionResponse:
      required:
      - completedAt
      - startedAt
      - status
      type: object
      properties:
        completedAt:
          type: string
          description: The timestamp indicating when the action was completed.
          format: date-time
        links:
          type: object
          additionalProperties:
            type: string
          description: A map of link names to associated URIs containing documentation about the error or recommended remediation steps
        requestedAt:
          type: string
          description: The timestamp indicating when the action was requested.
          format: date-time
        startedAt:
          type: string
          description: The timestamp indicating when the action was started.
          format: date-time
        status:
