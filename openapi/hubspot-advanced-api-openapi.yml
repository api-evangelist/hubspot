paths:
  /oauth/2026-09/token:
    post:
      tags:
      - Advanced
      summary: OAuth token endpoint
      description: Authenticates a client and returns access and refresh tokens.
      operationId: post-/oauth/2026-09/token_/oauth/v3/token
      parameters: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_assertion:
                  type: string
                client_assertion_type:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
                code:
                  type: string
                code_verifier:
                  type: string
                grant_type:
                  type: string
                  enum:
                  - authorization_code
                  - client_credentials
                  - refresh_token
                redirect_uri:
                  type: string
                refresh_token:
                  type: string
                scope:
                  type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponseIF'
        default:
          description: ''
          $ref: '#/components/responses/Error'
    servers:
    - url: https://api.hubapi.com
  /oauth/2026-09/token/introspect:
    post:
      tags:
      - Advanced
      summary: Token introspection endpoint
      description: Returns validity and metadata for access and refresh tokens.
      operationId: post-/oauth/2026-09/token/introspect_/oauth/v3/token/introspect
      parameters: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                token:
                  type: string
                token_type_hint:
                  type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenInfoResponseBaseIF'
        default:
          description: ''
          $ref: '#/components/responses/Error'
    servers:
    - url: https://api.hubapi.com
