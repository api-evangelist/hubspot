        layoutSections:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LayoutSection'
          description: A structure detailing the layout sections of the page.
        linkRelCanonicalUrl:
          type: string
          description: Optional override to set the URL to be used in the rel=canonical link tag on the page.
        mabExperimentId:
          type: string
          description: The ID of the MAB test (or dynamic test) associated with this page, if applicable
        metaDescription:
          type: string
          description: A description that goes in <meta> tag on the page.
        name:
          type: string
          description: The internal name of the page.
        pageExpiryDate:
          type: integer
          description: The date at which this page should expire and begin redirecting to another url or page.
          format: int64
        pageExpiryEnabled:
          type: boolean
          description: Boolean describing if the page expiration feature is enabled for this page
        pageExpiryRedirectId:
          type: integer
          description: The ID of another page this page's url should redirect to once this page expires. Should only set this or pageExpiryRedirectUrl.
          format: int64
        pageExpiryRedirectUrl:
          type: string
          description: The URL this page's url should redirect to once this page expires. Should only set this or pageExpiryRedirectId.
        pageRedirected:
          type: boolean
          description: A generated Boolean describing whether or not this page is currently expired and being redirected.
        password:
          type: string
          description: Set this to create a password protected page. Entering the password will be required to view the page.
        publicAccessRules:
          type: array
          description: Rules for require member registration to access private content.
          items:
            $ref: '#/components/schemas/PublicAccessRule'
        publicAccessRulesEnabled:
          type: boolean
          description: Boolean to determine whether or not to respect publicAccessRules.
        publishDate:
          type: string
          description: The date (ISO8601 format) the page is to be published at.
          format: date-time
        publishImmediately:
          type: boolean
          description: Set this to true if you want to be published immediately when the schedule publish endpoint is called, and to ignore the publish_date setting.
        slug:
          type: string
          description: The path of the this page. This field is appended to the domain to construct the url of this page.
        state:
          maxLength: 25
          type: string
          description: An ENUM descibing the current state of this page.
        subcategory:
          type: string
          description: Details the type of page this is. Should always be landing_page or site_page
        templatePath:
          type: string
          description: String detailing the path of the template used for this page.
        themeSettingsValues:
          type: object
          additionalProperties:
            type: object
            properties: {}
          description: A collection of settings specific to the theme applied to the page.
        translatedFromId:
          type: string
          description: ID of the primary page this object was translated from.
        translations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ContentLanguageVariation'
          description: A map of translations for the page, each associated with a specific language variation.
        updated:
          type: string
          description: The timestamp indicating when the page was last updated.
          format: date-time
        updatedById:
          type: string
          description: The ID of the user that updated this page.
        url:
          type: string
          description: A generated field representing the URL of this page.
        useFeaturedImage:
          type: boolean
          description: Boolean to determine if this page should use a featuredImage.
        widgetContainers:
          type: object
          additionalProperties:
            type: object
            properties: {}
          description: A data structure containing the data for all the modules inside the containers for this page. This will only be populated if the page has widget containers.
        widgets:
          type: object
          additionalProperties:
            type: object
            properties: {}
          description: A data structure containing the data for all the modules for this page.
    RGBAColor:
      required:
      - a
      - b
      - g
      - r
      type: object
      properties:
        a:
          type: number
          description: Alpha.
        b:
          type: integer
          description: Blue.
          format: int32
        g:
          type: integer
          description: Green.
          format: int32
        r:
          type: integer
          description: Red.
          format: int32
    Styles:
      required:
      - backgroundColor
      - backgroundGradient
      - backgroundImage
      - flexboxPositioning
      - forceFullWidthSection
      - maxWidthSectionCentering
      - verticalAlignment
      type: object
      properties:
        backgroundColor:
          $ref: '#/components/schemas/RGBAColor'
        backgroundGradient:
          $ref: '#/components/schemas/Gradient'
        backgroundImage:
          $ref: '#/components/schemas/BackgroundImage'
        breakpointStyles:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BreakpointStyles'
        flexboxPositioning:
          type: string
          description: Indicates whether flexbox positioning is enabled for the section.
          enum:
          - BOTTOM_CENTER
          - BOTTOM_LEFT
          - BOTTOM_RIGHT
          - MIDDLE_CENTER
          - MIDDLE_LEFT
          - MIDDLE_RIGHT
          - TOP_CENTER
          - TOP_LEFT
          - TOP_RIGHT
        forceFullWidthSection:
          type: boolean
          description: Determines if the section should be forced to full width.
        maxWidthSectionCentering:
          type: integer
          description: Defines the maximum width for centering the section.
          format: int32
        verticalAlignment:
          type: string
          description: Specifies the vertical alignment of elements within the section.
          enum:
          - BOTTOM
          - MIDDLE
          - TOP
    PageVersion:
      required:
      - id
      - object
      - updatedAt
      - user
      type: object
      properties:
        id:
          type: string
        object:
          $ref: '#/components/schemas/Page'
        updatedAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/VersionUser_2'
    SideOrCorner:
      required:
      - horizontalSide
      - verticalSide
      type: object
      properties:
        horizontalSide:
          type: string
          description: Specifies the horizontal side of an element.
          enum:
          - CENTER
          - LEFT
          - RIGHT
        verticalSide:
          type: string
          description: Specifies the vertical side of an element.
          enum:
          - BOTTOM
          - MIDDLE
          - TOP
    Margin:
      required:
      - bottom
      - top
      type: object
      properties:
        bottom:
          $ref: '#/components/schemas/Size'
        top:
          $ref: '#/components/schemas/Size'
    Padding:
      required:
      - bottom
      - left
      - right
      - top
      type: object
      properties:
        bottom:
          $ref: '#/components/schemas/Size'
        left:
          $ref: '#/components/schemas/Size'
        right:
          $ref: '#/components/schemas/Size'
        top:
          $ref: '#/components/schemas/Size'
    Gradient:
      required:
      - angle
      - colors
      - sideOrCorner
      type: object
      properties:
        angle:
          $ref: '#/components/schemas/Angle'
        colors:
          type: array
          items:
            $ref: '#/components/schemas/ColorStop'
        sideOrCorner:
          $ref: '#/components/schemas/SideOrCorner'
    CollectionResponseWithTotalPageVersion:
      required:
      - results
      - total
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        results:
          type: array
          items:
            $ref: '#/components/schemas/PageVersion'
        total:
          type: integer
          format: int32
    RowMetaData:
      required:
      - cssClass
      - styles
      type: object
      properties:
        cssClass:
          type: string
          description: The CSS class applied to the row metadata.
        styles:
          $ref: '#/components/schemas/Styles'
    ContentLanguageVariation:
      required:
      - archivedInDashboard
      - authorName
      - campaign
      - campaignName
      - created
      - id
      - name
      - password
      - publicAccessRules
      - publicAccessRulesEnabled
      - publishDate
      - slug
      - state
      - updated
      type: object
      properties:
        archivedInDashboard:
          type: boolean
          description: Indicates if the page is hidden from the dashboard, though it may still be live.
        authorName:
          type: string
          description: The name of the user that updated this page.
        campaign:
          type: string
          description: The GUID of the marketing campaign this page is a part of.
        campaignName:
          type: string
        created:
          type: string
          description: The date and time when the content language variation was created.
          format: date-time
        id:
          type: integer
          description: ID of object to set as primary in multi-language group.
          format: int64
        name:
          type: string
          description: The internal name of the page.
        password:
          type: string
          description: A password required to view the page, if set.
        publicAccessRules:
          type: array
          items:
            $ref: '#/components/schemas/PublicAccessRule'
        publicAccessRulesEnabled:
          type: boolean
          description: Determines if public access rules should be respected.
        publishDate:
          type: string
          description: The date and time when the page is scheduled to be published.
          format: date-time
        slug:
          type: string
          description: The path of this page, appended to the domain to construct the URL.
        state:
          type: string
          description: An ENUM descibing the current state of this page.
        tagIds:
          type: array
          items:
            type: integer
            format: int64
        updated:
          type: string
          description: The date and time when the content language variation was last updated.
          format: date-time
    ColorStop:
      required:
