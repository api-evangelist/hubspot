    ListSearchRequest:
      required:
      - additionalProperties
      - listIds
      - offset
      - processingTypes
      type: object
      properties:
        additionalProperties:
          type: array
          description: 'The property names of any additional list properties to include in the response. Properties that do not exist or that are empty for a particular list are not included in the response.


            By default, all requests will fetch the following properties for each list: `hs_list_size`, `hs_last_record_added_at`, `hs_last_record_removed_at`, `hs_folder_name`, and `hs_list_reference_count`.'
          items:
            type: string
        count:
          type: integer
          description: The number of lists to include in the response. Defaults to `20` if no value is provided. The max `count` is `500`.
          format: int32
        listIds:
          type: array
          description: ILS list ids to be included in search results. If not specified, all lists matching other criteria will be included
          items:
            type: string
        objectTypeId:
          type: string
        offset:
          type: integer
          description: Value used to paginate through lists. The `offset` provided in the response can be used in the next request to fetch the next page of results. Defaults to `0` if no offset is provided.
          format: int32
        processingTypes:
          type: array
          description: List processing types to be included in search results. If not specified, all lists with all processing types will be included.
          items:
            type: string
        query:
          type: string
          description: The `query` that will be used to search for lists by list name. If no `query` is provided, then the results will include all lists.
        sort:
          type: string
          description: Sort field and order
    PublicObjectListSearchResult:
      required:
      - additionalProperties
      - listId
      - listVersion
      - name
      - objectTypeId
      - processingStatus
      - processingType
      type: object
      properties:
        additionalProperties:
          type: object
          additionalProperties:
            type: string
          description: The name and value of any additional properties that exist for this list and that were included in the search request.
        createdAt:
          type: string
          description: The time when the list was created.
          format: date-time
        createdById:
          type: string
          description: The ID of the user that created the list.
        deletedAt:
          type: string
          description: The time when the list was deleted.
          format: date-time
        filtersUpdatedAt:
          type: string
          description: The time when the filters for this list were last updated.
          format: date-time
        listId:
          type: string
          description: The **ILS ID** of the list.
        listVersion:
          type: integer
          description: The version of the list.
          format: int32
        name:
          type: string
          description: The name of the list.
        objectTypeId:
          type: string
          description: The object type of the list.
        processingStatus:
          type: string
          description: The processing status of the list.
        processingType:
          type: string
          description: The processing type of the list.
        updatedAt:
          type: string
          description: The time the list was last updated.
          format: date-time
        updatedById:
          type: string
          description: The ID of the user that last updated the list.
