skips:
- label: Create contacts in HubSpot for new leads from Google Ads
  cause: catalog
  why: Google Ads lead form submissions are read through the generic GoogleAds search (GAQL) operation; the catalog spec carries no lead-form-specific operation to bind without guessing the query.
- label: Get Slack notifications for new HubSpot form submissions
  cause: catalog
  why: The HubSpot specs held in the catalog have no operation that reads form submissions (the legacy form-integrations submissions endpoint is not in them), so the trigger step cannot be bound.
