overlay: 1.0.0
info:
  title: API Evangelist conversational phrasing for the HubSpot + Zendesk contact-to-ticket integration
  version: 1.0.0
extends: integrations/hubspot-zendesk.yml
actions:
- target: $.workflows[?(@.workflowId == 'hubspot-contact-to-zendesk-ticket')]
  update:
    x-apievangelist-phrasing:
      intent: Open a support ticket for a new contact
      outcome: The person is a HubSpot contact and has an open Zendesk ticket for their request.
      effect: write
      stakeholders:
      - support lead
      - customer success lead
      - sales representative
      - small-business owner
      connects:
        from:
          provider: hubspot
          capability: unmapped
          tag: Basic
        to:
          provider: zendesk
          capability: BC-430.10 Customer Inquiry Management
          tag: Tickets
      questions:
      - How do I open a Zendesk ticket for someone I just added to HubSpot?
      - Can a new CRM contact get a support ticket created automatically?
      - How do I hand a new customer request from sales to support?
      instructions:
      - text: Create HubSpot contact {email} and open a Zendesk ticket titled {subject}.
      - text: Add {firstName} {lastName} to HubSpot and raise a ticket {subject} with {comment}.
      - text: 'Log {email} in HubSpot and file a Zendesk ticket: {subject}.'
      method: generated
      generated: '2026-10-12'
