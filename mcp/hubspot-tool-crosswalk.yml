method: derived
source: >-
  mcp/hubspot-mcp.yml (capability categories published at
  https://developers.hubspot.com/mcp) bound to the 260 operations across the 56
  OpenAPI documents in openapi/
note: >-
  HubSpot's MCP tool NAMES are not obtainable. tools/list on
  https://mcp.hubspot.com/anthropic/v1/mcp returns HTTP 401 with an OAuth
  challenge, and HubSpot's public MCP page enumerates CAPABILITY CATEGORIES, not
  tools. This crosswalk therefore binds each PUBLISHED CAPABILITY to the REST
  operations that back it — it does NOT invent tool names. Every `tool:` value
  below is HubSpot's own category wording, marked `tool_name: unknown`, and
  confidence is set accordingly. When the live manifest becomes readable this
  file should be re-derived tool-by-tool.
surfaces:
  openapi:
    path: openapi/
    documents: 56
    operations: 260
    gated: false
  mcp:
    url: https://mcp.hubspot.com/anthropic/v1/mcp
    gated: true
    gate: OAuth 2.0 bearer (401 + WWW-Authenticate resource_metadata)
    tools_listed: false
  mcp_local:
    install: hs mcp setup
    package: "@hubspot/mcp-server"
    gated: true
    note: developer-platform MCP server, started locally by the HubSpot CLI
  graphql:
    endpoint: null
    gated: false
    note: >-
      HubSpot publishes NO GraphQL endpoint — https://api.hubapi.com/graphql
      returns 404. graphql/hubspot-schema.graphql in this repo is an explicitly
      CONCEPTUAL SDL derived from the REST data model, not a provider surface,
      so it contributes no rows to this crosswalk.
